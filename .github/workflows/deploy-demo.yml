name: Publicar demonstração jurídica

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Gerar site estático
        working-directory: frontend
        env:
          GITHUB_PAGES: "true"
          VITE_LANDING_WHATSAPP: ${{ vars.LANDING_WHATSAPP }}
          # A landing é estática, mas a calculadora envia os dados para a API
          # pública hospedada no EasyPanel.
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://crm-juriditico-crm-juridico-api.kna79u.easypanel.host' }}
        run: npm run build

      - name: Preparar fallback das rotas
        shell: bash
        run: |
          cp frontend/dist/index.html frontend/dist/404.html
          mkdir -p frontend/dist/demo-juridico
          cp frontend/dist/index.html frontend/dist/demo-juridico/index.html
          mkdir -p frontend/dist/revisional-bancario
          cp frontend/dist/index.html frontend/dist/revisional-bancario/index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
